# Extra Helm values for k8s e2e deployments.
# e2e tests share resources using roles that are disabled by default
# ("Cannot access" and "Can view (secure)"), so enable them explicitly.
# Keep this list in sync with GRAPH_AVAILABLE_ROLES in
# tests/acceptance/run-e2e.py used by the non-k8s e2e setup.
features:
  roles:
    availableUnifiedRoles:
      - b1e2218d-eef8-4d4c-b82d-0f1a1b48f3b5 # Viewer
      - a8d5fe5e-96e3-418d-825b-534dbdf22b99 # SpaceViewer
      - fb6c3e19-e378-47e5-b277-9732f9de6e21 # Editor
      - 58c63c02-1d89-4572-916a-870abc5a1b7d # SpaceEditor
      - 2d00ce52-1fc2-4dbc-8b95-a73b73395f5a # FileEditor
      - 1c996275-f1c9-4e71-abdf-a42f6495e960 # EditorLite
      - 312c0871-5ef7-4b3a-85b6-0e4074c64049 # Manager
      - aa97fe03-7980-45ac-9e50-b325749fd7e6 # SecureViewer
      - 63e64e19-8d43-42ec-a738-2b6af2610efa # Denied
