---
# NOTE: owncloud/ocis-workflows has no published docker image on Docker Hub yet
# (no releases/tags exist). This builds both the frontend and backend directly
# from the ocis-workflows git repository. Revisit and switch to pinned images
# once ownCloud publishes them.
#
# workflows-backend build note: upstream's own Dockerfile lives at repo-root
# docker/Dockerfile and expects the build context to be the backend/
# subdirectory (their own compose file uses `context: ./backend` +
# `dockerfile: ../docker/Dockerfile`, escaping the context dir to reach the
# Dockerfile). CONFIRMED via `docker compose build workflows-backend`: a
# *remote git* context subdirectory does NOT allow that `../` escape
# ("failed to read dockerfile: open ../docker/Dockerfile: no such file or
# directory") - BuildKit's git checkout only exposes files inside the
# specified subdir. Worked around below by pointing the context at the whole
# repo (no subdir) and inlining a Dockerfile that reads from `backend/`.
services:
  ocis:
    environment:
      PROXY_ENABLE_APP_AUTH: "true"
    configs:
      - source: apps_yaml
        target: /etc/ocis/apps.yaml
    depends_on:
      workflows-init:
        condition: service_completed_successfully

  workflows-init:
    build:
      context: https://github.com/owncloud/ocis-workflows.git#main:frontend
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /src
        COPY . .
        RUN corepack enable && pnpm install --no-frozen-lockfile && pnpm build
        FROM alpine:3.22
        COPY --from=build /src/dist /dist
    user: root
    volumes:
      - ocis-apps:/apps
    entrypoint:
      - /bin/sh
    command: ["-c", "mkdir -p /apps/workflows && cp -R /dist/. /apps/workflows/"]

  workflows-backend:
    build:
      context: https://github.com/owncloud/ocis-workflows.git#main
      dockerfile_inline: |
        FROM golang:1.25-alpine AS build
        WORKDIR /src
        COPY backend/go.mod backend/go.sum ./backend/
        RUN cd backend && go mod download
        COPY backend ./backend
        RUN cd backend && CGO_ENABLED=0 go build -o /out/app ./cmd/workflows
        FROM alpine:3.22
        RUN apk add --no-cache ca-certificates
        COPY --from=build /out/app /usr/local/bin/app
        ENTRYPOINT ["/usr/local/bin/app"]
    command: ["server"]
    networks:
      ocis-net:
    environment:
      WORKFLOWS_OCIS_URL: https://${OCIS_DOMAIN:-ocis.owncloud.test}
      WORKFLOWS_OCIS_INSECURE: "${INSECURE:-false}"
      WORKFLOWS_LLM_ENDPOINT: ${AI_LLM_ENDPOINT:-http://host.docker.internal:11434/v1}
      WORKFLOWS_LLM_MODEL: ${AI_LLM_MODEL:-llama3.2}
      WORKFLOWS_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      WORKFLOWS_HTTP_ADDR: 0.0.0.0:9105
      WORKFLOWS_DEBUG_ADDR: 0.0.0.0:9109
      WORKFLOWS_ALLOWED_ORIGIN: https://${OCIS_DOMAIN:-ocis.owncloud.test}
      WORKFLOWS_DB_PATH: /data/workflows.db
      WORKFLOWS_ENCRYPTION_KEY: "${WORKFLOWS_ENCRYPTION_KEY:?WORKFLOWS_ENCRYPTION_KEY must be set, generate with openssl rand -base64 32}"
    volumes:
      - workflows-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.workflows-backend.entrypoints=https"
      - "traefik.http.routers.workflows-backend.rule=Host(`${OCIS_DOMAIN:-ocis.owncloud.test}`) && PathPrefix(`/workflows/api`)"
      - "traefik.http.routers.workflows-backend.tls.certresolver=http"
      - "traefik.http.middlewares.workflows-backend-strip.stripprefix.prefixes=/workflows"
      - "traefik.http.routers.workflows-backend.middlewares=workflows-backend-strip"
      - "traefik.http.services.workflows-backend.loadbalancer.server.port=9105"
    logging:
      driver: ${LOG_DRIVER:-local}
    restart: always

volumes:
  workflows-data:
