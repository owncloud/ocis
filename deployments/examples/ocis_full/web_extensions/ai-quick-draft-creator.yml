---
services:
  ocis:
    configs:
      - source: apps_yaml
        target: /etc/ocis/apps.yaml
    depends_on:
      ai-quick-draft-creator-init:
        condition: service_completed_successfully

  ai-quick-draft-creator-init:
    image: owncloud/web-extensions:ai-quick-draft-creator-0.1.0
    user: root
    volumes:
      - ./data/ocis-apps:/apps
    entrypoint:
      - /bin/sh
    command: ["-c", "cp -R /usr/share/nginx/html/ai-quick-draft-creator/ /apps"]
