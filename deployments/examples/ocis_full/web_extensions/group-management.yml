---
services:
  ocis:
    depends_on:
      group-management-init:
        condition: service_completed_successfully

  group-management-init:
    image: owncloud/web-extensions:group-management-0.1.0
    user: root
    volumes:
      - ocis-apps:/apps
    entrypoint:
      - /bin/sh
    command: ["-c", "cp -R /var/lib/nginx/html/group-management/ /apps"]
