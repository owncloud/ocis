---
services:
  ocis:
    volumes:
      - ./config/ocis/apps.yaml:/etc/ocis/apps.yaml
    depends_on:
      ai-sensitive-data-scanner-init:
        condition: service_completed_successfully

  ai-sensitive-data-scanner-init:
    image: owncloud/web-extensions:ai-sensitive-data-scanner-0.1.0
    user: root
    volumes:
      - ocis-apps:/apps
    entrypoint:
      - /bin/sh
    command: ["-c", "cp -R /var/lib/nginx/html/ai-sensitive-data-scanner/ /apps"]
