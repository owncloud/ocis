---
services:
  ocis:
    volumes:
      - ./config/ocis/apps.yaml:/etc/ocis/apps.yaml
    depends_on:
      ai-image-alt-text-sidebar-init:
        condition: service_completed_successfully

  ai-image-alt-text-sidebar-init:
    image: owncloud/web-extensions:ai-image-alt-text-sidebar-0.1.0
    user: root
    volumes:
      - ocis-apps:/apps
    entrypoint:
      - /bin/sh
    command: ["-c", "cp -R /var/lib/nginx/html/ai-image-alt-text-sidebar/ /apps"]
