---
services:
  ocis:
    configs:
      - source: apps_yaml
        target: /etc/ocis/apps.yaml
    depends_on:
      ai-smart-file-tagger-qa-init:
        condition: service_completed_successfully

  ai-smart-file-tagger-qa-init:
    image: owncloud/web-extensions:ai-smart-file-tagger-qa-0.1.0
    user: root
    volumes:
      - ./data/ocis-apps:/apps
    entrypoint:
      - /bin/sh
    command: ["-c", "cp -R /usr/share/nginx/html/ai-smart-file-tagger-qa/ /apps"]
