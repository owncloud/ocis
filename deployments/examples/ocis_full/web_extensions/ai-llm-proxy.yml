---
# NOTE: ai-llm-proxy has no published docker image on Docker Hub. Upstream
# (owncloud/web-extensions) also hardcodes a 60s timeout on the LLM call,
# which is too short for local/self-hosted reasoning models (e.g. Ollama)
# generating a few hundred tokens on modest hardware - measured ~195-296s for
# a realistic document-drafting prompt. Vendored locally under
# ./vendor/ai-llm-proxy with that timeout made configurable (LLM_TIMEOUT_MS)
# instead of building from the upstream git context. Revisit and switch back
# to a pinned upstream image/context once this is fixed upstream.
services:
  ai-llm-proxy:
    build:
      context: ./vendor/ai-llm-proxy
      dockerfile: Dockerfile
    networks:
      ocis-net:
    environment:
      PORT: "3030"
      # needed when oCIS / Traefik is using self generated certificates, see
      # the "companion" service in web_extensions/importer.yml for precedent
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      OCIS_URL: https://${OCIS_DOMAIN:-ocis.owncloud.test}
      LLM_ENDPOINT: ${AI_LLM_ENDPOINT:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${AI_LLM_API_KEY:-}
      LLM_MODEL: ${AI_LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${AI_LLM_TIMEOUT_MS:-600000}
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-llm-proxy.entrypoints=https"
      - "traefik.http.routers.ai-llm-proxy.rule=Host(`${OCIS_DOMAIN:-ocis.owncloud.test}`) && PathPrefix(`/ai-llm-proxy`)"
      - "traefik.http.routers.ai-llm-proxy.tls.certresolver=http"
      - "traefik.http.middlewares.ai-llm-proxy-strip.stripprefix.prefixes=/ai-llm-proxy"
      - "traefik.http.routers.ai-llm-proxy.middlewares=ai-llm-proxy-strip"
      - "traefik.http.services.ai-llm-proxy.loadbalancer.server.port=3030"
    logging:
      driver: ${LOG_DRIVER:-local}
    restart: always
