version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/services/idp"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - "/"
      - "/ocis/docker"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
