name: Validate PR title

# The squash-merge commit uses the PR title, and the release notes are
# generated from it (see cliff.toml), so the title must be conventional.
on:
  pull_request_target:
    branches: [master, stable-*]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      # every service is a scope, plus the cross-cutting ones below; read from
      # the base branch through the API, the PR code is never checked out
      - id: scopes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          {
            echo 'list<<EOF'
            gh api "repos/$REPO/contents/services?ref=$BASE" --jq '.[] | select(.type == "dir") | .name'
            printf '%s\n' ocis web deps deps-dev deployments ci release tests
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            perf
            security
            chore
            test
            build
            ci
            docs
            style
            refactor
            revert
          scopes: ${{ steps.scopes.outputs.list }}
          requireScope: false
          # allow CI markers such as "[full-ci][tests-only]" in front of the type
          headerPattern: '^(?:\[[a-z0-9.-]+\]\s*)*(\w*)(?:\((.*)\))?(!)?:\s(.*)$'
          headerPatternCorrespondence: type, scope, breaking, subject
