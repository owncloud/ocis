name: Validate PR title

# The squash-merge commit uses the PR title, and the release notes are
# generated from it (see cliff.toml), so the title must be a conventional commit.
on:
  pull_request_target:
    branches: [master, stable-*]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # allow CI markers such as "[full-ci][tests-only]" in front of the type
          headerPattern: '^(?:\[[a-z0-9.-]+\]\s*)*(\w*)(?:\((.*)\))?(!)?:\s(.*)$'
          headerPatternCorrespondence: type, scope, breaking, subject
          # lowercase description, as in the spec examples
          subjectPattern: '^(?![A-Z]).+$'
          subjectPatternError: 'The description "{subject}" must start with a lowercase letter.'
