name: Release NPM packages

on:
  push:
    tags:
      - "babel-preset-v*"
      - "design-system-v*"
      - "eslint-config-v*"
      - "extension-sdk-v*"
      - "prettier-config-v*"
      - "tsconfig-v*"
      - "web-client-v*"
      - "web-pkg-v*"
      - "web-test-helpers-v*"

jobs:
  release-npm:
    name: Publish NPM package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.33.3 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Determine package
        id: package
        run: |
          TAG="${GITHUB_REF_NAME}"
          PACKAGES="babel-preset design-system eslint-config extension-sdk prettier-config tsconfig web-client web-pkg web-test-helpers"
          for pkg in $PACKAGES; do
            if [[ "$TAG" == "${pkg}-v"* ]]; then
              echo "name=$pkg" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#${pkg}-v}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "tag '$TAG' does not match any known package prefix: $PACKAGES"
          exit 1

      - name: Verify package version
        run: |
          PKG="${STEPS_PACKAGE_OUTPUTS_NAME}"
          VERSION="${STEPS_PACKAGE_OUTPUTS_VERSION}"
          ACTUAL_VERSION=$(jq -r '.version' < "packages/${PKG}/package.json")
          echo "Build ${PKG} ${VERSION} package.json: ${ACTUAL_VERSION}"
          if [ "${ACTUAL_VERSION}" != "${VERSION}" ]; then
            echo "git tag does not match version in web/packages/${PKG}/package.json"
            exit 1
          fi
        env:
          STEPS_PACKAGE_OUTPUTS_NAME: ${{ steps.package.outputs.name }}
          STEPS_PACKAGE_OUTPUTS_VERSION: ${{ steps.package.outputs.version }}

      - name: Build tokens
        run: pnpm build:tokens

      - name: Build package
        run: |
          PKG="${STEPS_PACKAGE_OUTPUTS_NAME}"
          case "$PKG" in
            design-system|web-client|web-pkg|web-test-helpers)
              pnpm --filter "@ownclouders/${PKG}" vite build
              ;;
          esac
        env:
          STEPS_PACKAGE_OUTPUTS_NAME: ${{ steps.package.outputs.name }}

      - name: Publish to NPM
        run: |
          pnpm publish \
            --no-git-checks --filter "@ownclouders/${STEPS_PACKAGE_OUTPUTS_NAME}" \
            --access public --tag latest
        env:
          STEPS_PACKAGE_OUTPUTS_NAME: ${{ steps.package.outputs.name }}
