name: Check licenses
on:
  pull_request:
  push:
    branches: [master, stable-*]

# Pull request runs cancel their predecessor on the same PR. Every other
# event gets its own group, so pushes and scheduled runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install REUSE tool
        run: pip install reuse

      - name: Run REUSE lint
        run: reuse lint
