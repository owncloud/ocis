# this file should be reviewed, because the referenced files often do not exist
# such as 'protoc-gen-openapiv2' only 'protoc-gen-openapiv2-v2.13.0' exists...
version: v1
plugins:
  - name: go
    path: ../../.bingo/protoc-gen-go
    out: ../gen/
    opt:
      - paths=source_relative

  - name: micro
    path: ../../.bingo/protoc-gen-micro
    out: ../gen/
    opt:
      - paths=source_relative

  - name: microweb
    path: ../../.bingo/protoc-gen-microweb
    out: ../gen/
    opt:
      - paths=source_relative
      - "ignore_packages=\
         ocis.services.thumbnails.v0;\
         ocis.messages.thumbnails.v0;\
         ocis.services.store.v0;\
         ocis.messages.store.v0;\
         ocis.services.eventhistory.v0;\
         ocis.messages.eventhistory.v0;\
         ocis.services.policies.v0;\
         ocis.messages.policies.v0"

  - name: openapiv2
    path: ../../.bingo/protoc-gen-openapiv2
    out: ../gen/
