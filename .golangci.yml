version: "2"
run:
  modules-download-mode: readonly
linters:
  default: all
  disable:
    - arangolint # not available in golangci-lint v1.64.6
    - clickhouselint # not available in golangci-lint v1.64.6
    - embeddedstructfieldcheck # not available in golangci-lint v1.64.6
    - exhaustruct_v5 # not available in golangci-lint v1.64.6
    - funcorder # not available in golangci-lint v1.64.6
    - godoclint # not available in golangci-lint v1.64.6
    - gomodguard_v2 # not available in golangci-lint v1.64.6
    - iotamixing # not available in golangci-lint v1.64.6
    - modernize # not available in golangci-lint v1.64.6
    - noinlineerr # not available in golangci-lint v1.64.6
    - unqueryvet # not available in golangci-lint v1.64.6
    - wsl_v5 # not available in golangci-lint v1.64.6
    - containedctx
    - contextcheck
    - cyclop
    - depguard
    - dupl
    - err113
    - errorlint
    - exhaustive
    - exhaustruct
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gocognit
    - gocritic
    - godot
    - godox
    - ireturn
    - lll
    - mnd
    - nestif
    - nlreturn
    - noctx
    - nonamedreturns
    - paralleltest
    - tagliatelle
    - testpackage
    - unparam
    - varnamelen
    - whitespace
    - wrapcheck
    - wsl
  settings:
    gocyclo:
      min-complexity: 35
    gomoddirectives:
      replace-allow-list:
        - github.com/studio-b12/gowebdav
        - github.com/egirna/icap-client
        - github.com/unrolled/secure
        - github.com/go-micro/plugins/v4/store/nats-js-kv
        - go-micro.dev/v4
    interfacebloat:
      max: 15
    tagalign:
      align: false
      sort: true
      order:
        - json
        - yaml
        - mapstructure
        - env
        - desc
        - introductionVersion
        - deprecationVersion
        - removalVersion
        - deprecationInfo
        - deprecationReplacement
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test.go
        source: .
    paths:
      - protogen/gen
      - docs
      - deployments
      - changelog
      - third_party$
      - builtin$
      - examples$
severity:
  default: error
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - protogen/gen
      - docs
      - deployments
      - changelog
      - third_party$
      - builtin$
      - examples$
